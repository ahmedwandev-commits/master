# ============================================================================
# Stage 6: send_report — Outlook email at end of pipeline
# ============================================================================
# Sends a status email via Outlook (win32com.client) when stage 6 runs.
# Attachment paths are RELATIVE to the run folder, so they keep working
# automatically as the run-folder name changes each day.
#
# Subject template tokens:
#   {run_folder}  — the run folder name (e.g. 'ACCESS MATRIX VS SYSTEM  RUN ...')
#   {date}        — ISO date (YYYY-MM-DD)
#
# Set `enabled: false` to skip sending entirely (useful during testing).
# When stage 6 fails to send (Outlook closed, recipient rejected, etc.) the
# pipeline finishes normally; the failure is reported in the terminal and
# in failures/failures_*.txt.
email:
  enabled: false
  # recipient: 'Iflex.SMS.team@nbe.com.eg'
  # recipient: 'hany.fekry@nbe.com.eg'

  # Carbon-copy recipients. Can be a YAML list (preferred) or a single
  # string. Leave the list empty (or remove it) to send with no CC.
  cc:
    # - 'yasser_bayomy@nbe.com.eg'
    # - 'waleed_as@nbe.com.eg'

  subject: 'Access Matrix Pipeline Report — {run_folder}'

  # The headline deliverables of a pipeline run. Paths are relative to
  # the run folder (use absolute paths if you really must point at
  # something outside the run folder).
  #
  # Patterns containing '*' or '?' are expanded with glob.glob():
  #   - matches are attached (one file per match)
  #   - zero matches are silently skipped (e.g. failures_*.txt when
  #     nothing failed)
  # Literal paths that don't exist are reported in the email body's
  # "Missing Attachments" section.
  attachments:
    - '04_Comparison/all_differences/_summary.xlsx'
    - '04_Comparison/all_differences/generated_sql/all_remediation_summary.xlsx'
    - '04_Comparison/all_differences/generated_sql/all_remediation.sql'
    # Stage 1's per-run index workbook (filename has a timestamp).
    - '02_Reports/access_matrix_index_*.xlsx'
    # Per-run failures report — only present when something failed.
    - 'failures/failures_*.txt'